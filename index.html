<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>DRAXSUS</title>
<meta name="robots" content="noindex, nofollow"/>
<!-- installed on a phone home screen it opens full screen, like the app itself -->
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="DRAXSUS"/>
<meta name="theme-color" content="#08080C"/>
<link rel="apple-touch-icon" href="assets/app-icon-180.png"/>
<link rel="icon" href="assets/app-icon-180.png"/>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="stylesheet" href="fonts/fonts.css"/>
<link rel="stylesheet" href="styles.css"/>
<style>
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  html, body { height: 100%; }
  body { background: radial-gradient(ellipse at center, #1a1a22 0%, #0a0a0e 100%); display: flex; align-items: center; justify-content: center; overflow: hidden; color: #fff; }
  .stage { display: flex; flex-direction: column; align-items: center; gap: 18px; transform-origin: center center; }
  .restart { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 999px; background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.6); font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 11px;
    letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; }
  .restart:hover { color: #fff; }
  /* phone: the prototype is the whole screen — no rubber-band scroll, no text selection or tap flashes */
  html.phone, html.phone body { background: #08080C; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; touch-action: manipulation; }
</style>
</head>
<body>
<div id="root"></div>

<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>


<script src="js/ios-frame.js"></script>

<script src="js/social.js"></script>
<script src="js/parents.js"></script>
<script src="js/shop.js"></script>
<script src="js/game.js"></script>

<script src="js/app.js"></script>
<div id="offline-note" style="position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 14px);transform:translateX(-50%);
  z-index:1000;padding:9px 16px;border-radius:999px;background:rgba(20,20,30,0.92);border:1px solid rgba(255,255,255,0.12);color:#fff;
  font:600 13px Manrope,system-ui,sans-serif;white-space:nowrap;display:none;transition:opacity .4s"></div>
<script src="offline.js"></script>
</body>
</html>
